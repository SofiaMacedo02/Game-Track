<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrack API</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Game Track</h1>
    <p>Sua biblioteca de jogos</p>

    <div class="quadrinhos">
        <div class="jogos_cadas">
            <span id="total_jogos">0</span>
            <p>Jogos Cadastrados</p>
        </div>
        <div class="jogando">
            <span id="jogando">0</span>
            <p>Jogando</p>
        </div>
        <div class="finalizados">
            <p>Finalizados</p>
        </div>
    </div>

    <div class="lista_bnts"> 
        <ul id="lista_jogos"></ul>
    </div>
 
</main>

</body>
</html>
